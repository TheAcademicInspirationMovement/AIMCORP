<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" preserveAspectRatio="xMidYMid slice">
  <!-- Built from the Loka brand mark (loka_brand_kit/svg/loka-icon-color.svg),
       enlarged to bleed off the canvas so it reads as artwork rather than a
       logo. Beacon #e8a94a and Signal #49c9bd are from brand-spec.txt v1.0. -->
  <defs>
    <linearGradient id="bg-loka" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1811"/>
      <stop offset="1" stop-color="#0e1016"/>
    </linearGradient>
    <pattern id="gr-loka" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0H0v45" fill="none" stroke="#e8a94a" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="640" fill="url(#bg-loka)"/>
  <rect width="900" height="640" fill="url(#gr-loka)"/>

  <!-- Wide orbits carried across the full canvas -->
  <g fill="none" stroke="#49c9bd" stroke-opacity="0.14" stroke-width="1.3">
    <ellipse cx="620" cy="300" rx="470" ry="165" transform="rotate(-18 620 300)"/>
    <ellipse cx="620" cy="300" rx="470" ry="165" transform="rotate(22 620 300)"/>
  </g>

  <!-- The mark, scaled from its 1486 viewBox and allowed to run off-canvas -->
  <g transform="translate(700 290) scale(0.66) translate(-723 -723)">
    <circle cx="723" cy="723" r="623" fill="none" stroke="#e8a94a" stroke-opacity="0.2" stroke-width="104"/>
    <ellipse cx="723" cy="723" rx="209.2" ry="486.4" fill="none" stroke="#49c9bd" stroke-width="26" stroke-opacity="0.26"/>
    <ellipse cx="723" cy="723" rx="486.4" ry="141.2" fill="none" stroke="#49c9bd" stroke-width="26" stroke-opacity="0.26"/>
    <g stroke="#49c9bd" stroke-width="20" stroke-opacity="0.3">
      <line x1="723" y1="723" x2="503.3" y2="566.1"/>
      <line x1="723" y1="723" x2="932.2" y2="503.3"/>
      <line x1="723" y1="723" x2="451" y2="869.4"/>
      <line x1="723" y1="723" x2="963.6" y2="911.3"/>
    </g>
    <g fill="#49c9bd" fill-opacity="0.45">
      <circle cx="503.3" cy="566.1" r="38"/>
      <circle cx="932.2" cy="503.3" r="38"/>
      <circle cx="451" cy="869.4" r="38"/>
      <circle cx="963.6" cy="911.3" r="38"/>
    </g>
    <circle cx="723" cy="723" r="54" fill="#e8a94a" fill-opacity="0.55"/>
  </g>
</svg>
